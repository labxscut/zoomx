#!/bin/bash
#if zoomx python entry-points (parse10x, gridScan, refineBreak) 
#and utility scripts are not in your PATH
#NOTES:
#  ZOOMXPKG has to be set per user here 
#  caseCovFile/controlCovFile is ignored if specified as "none" or it is not found
ZOOMXPKG=$HOME/setup/zoomx                #where the zoomx package is located
ZOOMXPATH=$ZOOMXPKG/zoomx                 #where the python libs of zoomx are located
SCRIPTPATH=$ZOOMXPKG/scripts              #where the uitlity scripts zoomx are located
PATH=$SCRIPTPATH:$PATH                    #add script path to PATH
mydate=$(LC_ALL=en_US.utf8 date +%Y%b%d)  #get today's date
mode=germline                             #is this somatic or germline run?
essentialStages=(caseCov caseParse caseScan caseDistRef caseTransRef caseCisRef caseDistPlot caseTransPlot caseCisPlot)                     #essential stages for a germline zoomxRun
extendedStages=()                         #extended stages for a germline zoomxRun
ref=human_g1k_v37.ucsc.fasta              #prefix to the grid file, the acutal ucsc reference fasta is not required
grid=$ref.bed.w10Ks5K                     #scan grid file (*required*), e.g. a bed file of 10 Kbp half-overlap sliding windows
covGrid=$ref.bed.w100s100                 #coverage grid file (*required*), e.g. a bed file of 100 bp non-overlap sliding windows
gapFile=$ref.acen+gap.bed                 #calls overlap (padded) gap regions or other regions to be excluded
outputPf=.                                #output dir
logDir=$outputPf/logs                     #output of logs
cfgDir=$outputPf/cfgs                     #output of cfgs
datDir=$outputPf/data                     #zoomx space results
resDir=$outputPf/results                  #user space results
plotDir=$outputPf/plots                   #user space plots
distSize=200000                           #min base pair distance between breakpoints to qualify as distal junctions
cisSize=50000                             #min base pair distance between breakpoints to qualify as mid-range junctions
casePf=.                                  #input dir of case bam file
caseBam=NA12878.wg12.chr22-22M-24M.bam    #case bam and bai file (*required*), $caseBam.bai is assumed to be in place
caseGenomeSize=2000000                    #needed for correction of Cem estimates`
caseExp=25                                #minimum expected allele frequency in case
caseMax=1000000                           #maximum expected number of junctions in case
caseCovFile=$outputPf/$caseBam.cov100     #coverage file, $covGrid plus coverage col, generated by ZoomX in caseCovScan 
isUCSC="--isUCSC"                         #turn on --isUCSC if in UCSC format, i.e. seqname is chrX not X
maxPlot=100                               #maximum number of plots
